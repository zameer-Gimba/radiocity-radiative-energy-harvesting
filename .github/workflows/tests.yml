name: Tests and Radiocity Experiments

on:
  push:
  pull_request:

jobs:
  test-and-experiments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Run TPV temperature-bandgap map
        run: python scripts/tpv_temperature_bandgap_map.py
      - name: Upload TPV map
        uses: actions/upload-artifact@v4
        with:
          name: tpv-temperature-bandgap-map
          path: results/tpv_temperature_bandgap_map.csv
