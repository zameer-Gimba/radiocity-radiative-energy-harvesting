name: Pylint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pylint
        run: python -m pip install --upgrade pip pylint

      - name: Run Pylint
        run: |
          pylint src/radiocity \
            --disable=duplicate-code,too-many-arguments,too-many-positional-arguments,too-many-locals,too-many-instance-attributes,cell-var-from-loop,line-too-long
